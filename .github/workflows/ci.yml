name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  ci-pipeline:
    name: Lint & Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev pkg-config

      - name: Install Rust 1.94 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94
          components: clippy, rustfmt

      - name: Identify native build environment
        id: native
        run: |
          . /etc/os-release
          ffmpeg_versions=$(pkg-config --modversion libavcodec libavformat libavutil libswscale libswresample | paste -sd-)
          echo "cache-key=${ID}-${VERSION_ID}-ffmpeg-${ffmpeg_versions}" >> "$GITHUB_OUTPUT"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Cached FFmpeg bindings must match the installed libraries, even when
          # ubuntu-latest moves to a new image with the same Rust toolchain.
          key: ${{ steps.native.outputs.cache-key }}

      - name: Check, lint, test and build
        run: make ci

      - name: Test ugoira encoding
        run: cargo test -p pixivbot --features ffmpeg-codec pixiv::downloader::tests
